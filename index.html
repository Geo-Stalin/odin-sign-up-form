<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="img_section">
        <div class="logo_section">
            <img src="images/odin-lined.png">
            <span>ODIN</span>
        </div>
        <span>
            Photo by 
            <a href="https://www.pexels.com/@kelsey-a-522600494/" target="_blank">Kelsey A</a> 
            on 
            <a href="https://www.pexels.com/" target="_blank">Pexels</a>
        </span>
    </div>
    <div class="container">
        <div class="upper">

            <span>
                This is not a real online service! You know you need something like this in your life to help you realize
                your deepest dreams.
            </span>
            <span>
                <p>Sign up <em>now</em> to get started.</p>
            </span>
            <span id="special_span"><p>You <em>know</em> you want to.</p></span>
        </div>
            <form>
            <div class="credentials">
                <span>Let's do this!</span>
                <section>
                <div class="form-group">
                    <label for="first_name">FIRST NAME</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                <div class="form-group">
                    <label for="last_name">LAST NAME</label>
                    <input type="text" id="last_name" name="last_name">
                </div>
                <div class="form-group">
                    <label for="mail">EMAIL</label>
                    <input type="email" id="mail" name="mail" required>
                </div>
                <div class="form-group">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="first_name">PASSWORD</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="conf_pass">CONFIRM PASSWORD</label>
                    <input type="password" id="conf_pass" name="conf_pass" required>
                </div>
                </section>
            </div>
            <div class="lower">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </form>
    </div>
</body>

</html>
